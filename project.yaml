project: research-bench-pilot
repo_url: https://github.com/andrei-shtanakov/research-bench
repo_path: ~/labs/all_ai_orchestrators/research-bench
workspace_base: /tmp/maestro-ws/research-bench
max_concurrent: 1
base_branch: master
branch_prefix: "research/"
auto_pr: true

spec_runner:
  max_retries: 2
  task_timeout_minutes: 45
  auto_commit: true
  create_git_branch: true
  run_tests_on_done: true
  test_command: "uv run bench-verify --brief briefs/sqlite-wal"
  run_lint_on_done: false
  # Research domain: the code-review stage treats the report as code and
  # rewrites bench sources out of scope (golden run 1 evidence). The scope
  # gate stays the real protection; the reviewer is simply wrong-domain here.
  extra_executor_config:
    executor:
      hooks:
        post_done:
          run_review: false

workstreams:
  - id: sqlite-wal-report-v2
    title: "Research report: SQLite WAL trade-offs (v2: independent benchmark)"
    description: |
      Update the EXISTING reports/sqlite-wal/result.md so it satisfies ALL
      acceptance criteria in briefs/sqlite-wal/criteria.yaml (read-only for
      you), including the new independent-benchmark criterion. Keep the
      existing structure and citations; add what is missing.
      IMPORTANT: plan this as EXACTLY ONE executable task.
      Do not split into multiple tasks.
      You are writing a research REPORT, not code. Never modify src/**,
      tests/**, pyproject.toml, bench.config.yaml, prompts/**, briefs/**
      or spec/plugins/** — verification tooling is off-limits. Write only
      reports/sqlite-wal/result.md.
    scope:
      - "reports/sqlite-wal/**"
      - "verdicts/sqlite-wal/**"
    depends_on: []
