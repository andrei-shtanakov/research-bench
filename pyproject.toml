[project]
name = "research-bench"
version = "0.1.0"
description = "Stage A pilot: research-domain vertical slice over Maestro/spec-runner"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "spec-runner>=2.9,<3",
]

[project.scripts]
bench-verify = "research_bench.cli:main"
single-task-guard = "research_bench.guard:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "pyrefly>=0.16",
    "jsonschema>=4.26.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/research_bench"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]

[tool.pytest.ini_options]
markers = ["slow: integration tests that spawn spec-runner"]

[tool.pyrefly]
project-includes = [
    "**/*.py*",
    "**/*.ipynb",
]
